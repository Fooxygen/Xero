
name: Release for Windows

on:
    push:
        tags:
            - '**'
    workflow_dispatch: {}

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            -   uses: actions/checkout@v7

            -   uses: msys2/setup-msys2@v2
                with:
                    msystem: UCRT64
                    install: >-
                        mingw-w64-ucrt-x86_64-gcc
                        mingw-w64-ucrt-x86_64-cmake
                        mingw-w64-ucrt-x86_64-ninja
                        mingw-w64-ucrt-x86_64-llvm
                        zip

            -   name: Configure and Build
                shell: msys2 {0}
                run: |
                    cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                        -DCMAKE_CXX_COMPILER=g++ \
                        -DLLVM_DIR="$MINGW_PREFIX/lib/cmake/llvm" \
                        -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
                    cmake --build build

            -   name: Package
                shell: msys2 {0}
                run: |
                    mkdir -p dist
                    cp build/bin/xero.exe dist/
                    objdump -p build/bin/xero.exe | sed -n 's/.*DLL Name: //p' | while read -r dll; do
                        if [ -f "$MINGW_PREFIX/bin/$dll" ]; then
                            cp "$MINGW_PREFIX/bin/$dll" dist/
                        fi
                    done
                    ls -l dist/
                    tar -czf xero-windows-x64.tar.gz -C dist .
                    zip -j xero-windows-x64.zip dist/*

            -   name: Create Draft Release
                uses: softprops/action-gh-release@v3
                with:
                    files: |
                        xero-windows-x64.tar.gz
                        xero-windows-x64.zip
                    draft: true
          